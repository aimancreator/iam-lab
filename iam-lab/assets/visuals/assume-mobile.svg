<svg xmlns="http://www.w3.org/2000/svg" width="440" height="860" viewBox="0 0 440 860" role="img" aria-labelledby="title description"><title id="title">Assume means get a temporary session</title><desc id="description">Attaching a policy defines permissions. Assuming a role obtains temporary credentials to use that role.</desc><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#203b36}.title{font-size:29px;font-weight:700}.body{font-size:25px;fill:#405c54}.connector{font-size:15px;font-weight:700;fill:#61776c}</style><rect width="100%" height="100%" rx="22" fill="#f5f7ef"/><g><rect x="20" y="16" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="80" r="46" fill="#e7efdf"/><g transform="translate(188 48) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 65V10h52v55M22 22h28v43M8 65h56M30 38l5 5 10-12"/></g><text x="220" y="153" class="title">AssumeRole check</text><text x="220" y="195" class="body">Caller + trust + MFA</text><text x="220" y="230" class="body">For this lab’s trust pattern</text></g><g><rect x="20" y="308" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="372" r="46" fill="#e7efdf"/><g transform="translate(188 340) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16h62v14a7 7 0 0 0 0 14v14H5V44a7 7 0 0 0 0-14zM48 23v5M48 34v5M48 45v5M16 31h21M16 43h14"/></g><text x="220" y="445" class="title">Temporary session</text><text x="220" y="487" class="body">STS supplies credentials</text><text x="220" y="522" class="body">Act as the role</text></g><g><rect x="20" y="600" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="664" r="46" fill="#e7efdf"/><g transform="translate(188 632) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="8" width="46" height="58" rx="7"/><path d="M27 8V4h20v4M23 27l4 4 6-8M39 27h12M23 43l4 4 6-8M39 43h12M25 57h26"/></g><text x="220" y="737" class="title">Role permissions</text><text x="220" y="779" class="body">Use the role’s rules</text><text x="220" y="814" class="body">Not user + role combined</text></g><text x="220" y="293" class="connector" transform="rotate(90 220 285)">→</text><text x="220" y="585" class="connector" transform="rotate(90 220 577)">→</text></svg>
