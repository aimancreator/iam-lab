<svg xmlns="http://www.w3.org/2000/svg" width="440" height="860" viewBox="0 0 440 860" role="img" aria-labelledby="title description"><title id="title">Temporary credentials have three parts</title><desc id="description">Use the access key ID, secret access key, and session token together. Get new credentials after they expire.</desc><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#203b36}.title{font-size:29px;font-weight:700}.body{font-size:25px;fill:#405c54}.connector{font-size:15px;font-weight:700;fill:#61776c}</style><rect width="100%" height="100%" rx="22" fill="#f5f7ef"/><g><rect x="20" y="16" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="80" r="46" fill="#e7efdf"/><g transform="translate(188 48) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="48" height="54" rx="6"/><path d="M26 12V5h20v7M26 50h20"/><circle cx="36" cy="32" r="8"/></g><text x="220" y="153" class="title">Access key ID</text><text x="220" y="195" class="body">Identifies the credential</text><text x="220" y="230" class="body">Temporary, not a username</text></g><g><rect x="20" y="308" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="372" r="46" fill="#e7efdf"/><g transform="translate(188 340) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M36 5L62 16v18c0 15-11 27-26 34C21 61 10 49 10 34V16zM23 35l9 9 17-21"/></g><text x="220" y="445" class="title">Secret access key</text><text x="220" y="487" class="body">Used to sign requests</text><text x="220" y="522" class="body">Keep it secret</text></g><g><rect x="20" y="600" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="664" r="46" fill="#e7efdf"/><g transform="translate(188 632) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16h62v14a7 7 0 0 0 0 14v14H5V44a7 7 0 0 0 0-14zM48 23v5M48 34v5M48 45v5M16 31h21M16 43h14"/></g><text x="220" y="737" class="title">Session token</text><text x="220" y="779" class="body">Required for the session</text><text x="220" y="814" class="body">Do not leave it out</text></g><text x="220" y="293" class="connector">AND</text><text x="220" y="585" class="connector">AND</text></svg>
