<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-labelledby="title description"><title id="title">Limits do not grant permissions</title><desc id="description">In this identity-policy example, the grant must fit within every applicable limit. An explicit Deny still wins.</desc><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#203b36}.title{font-size:26px;font-weight:700}.body{font-size:21px;fill:#405c54}.connector{font-size:15px;font-weight:700;fill:#61776c}</style><rect width="100%" height="100%" rx="22" fill="#f5f7ef"/><g><rect x="16" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="170" cy="97" r="46" fill="#e7efdf"/><g transform="translate(138 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="8" width="46" height="58" rx="7"/><path d="M27 8V4h20v4M23 27l4 4 6-8M39 27h12M23 43l4 4 6-8M39 43h12M25 57h26"/></g><text x="170" y="181" class="title">Identity policy</text><text x="170" y="227" class="body">Must grant the action</text><text x="170" y="263" class="body">This provides the Allow</text></g><g><rect x="386" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="540" cy="97" r="46" fill="#e7efdf"/><g transform="translate(508 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 65V10h52v55M22 22h28v43M8 65h56M30 38l5 5 10-12"/></g><text x="540" y="181" class="title">Boundary</text><text x="540" y="227" class="body">Must permit the action</text><text x="540" y="263" class="body">When a boundary applies</text></g><g><rect x="756" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="910" cy="97" r="46" fill="#e7efdf"/><g transform="translate(878 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M36 5L62 16v18c0 15-11 27-26 34C21 61 10 49 10 34V16zM23 35l9 9 17-21"/></g><text x="910" y="181" class="title">Organization limit</text><text x="910" y="227" class="body">Must permit the action</text><text x="910" y="263" class="body">When an SCP applies</text></g><text x="355" y="183" class="connector">AND</text><text x="725" y="183" class="connector">AND</text></svg>
