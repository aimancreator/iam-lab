<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-labelledby="title description"><title id="title">Local reset is not AWS cleanup</title><desc id="description">Use your administrator to remove only resources created for this lab. A simulator reset changes nothing in AWS.</desc><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#203b36}.title{font-size:26px;font-weight:700}.body{font-size:21px;fill:#405c54}.connector{font-size:15px;font-weight:700;fill:#61776c}</style><rect width="100%" height="100%" rx="22" fill="#f5f7ef"/><g><rect x="16" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="170" cy="97" r="46" fill="#e7efdf"/><g transform="translate(138 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="36" cy="14" rx="26" ry="9"/><path d="M10 14l6 43c2 14 38 14 40 0l6-43M16 48c8 8 32 8 40 0"/></g><text x="170" y="181" class="title">Empty lab buckets</text><text x="170" y="227" class="body">Remove lab objects first</text><text x="170" y="263" class="body">Include versions if used</text></g><g><rect x="386" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="540" cy="97" r="46" fill="#e7efdf"/><g transform="translate(508 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="62" height="62" rx="12"/><circle cx="26" cy="27" r="8"/><circle cx="48" cy="27" r="8"/><path d="M13 56v-5a13 13 0 0 1 26 0v5M40 39a13 13 0 0 1 19 12v5"/></g><text x="540" y="181" class="title">Remove lab IAM</text><text x="540" y="227" class="body">Users / groups / policies</text><text x="540" y="263" class="body">Lab-created roles only</text></g><g><rect x="756" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="910" cy="97" r="46" fill="#e7efdf"/><g transform="translate(878 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="28" r="21"/><path d="M45 45l22 22M20 27l7 7 13-15"/></g><text x="910" y="181" class="title">Verify cleanup</text><text x="910" y="227" class="body">Check the named resources</text><text x="910" y="263" class="body">Keep shared resources</text></g><text x="355" y="183" class="connector">→</text><text x="725" y="183" class="connector">→</text></svg>
