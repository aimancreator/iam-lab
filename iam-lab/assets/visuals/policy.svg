<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-labelledby="title description"><title id="title">Read a policy as one simple sentence</title><desc id="description">Allow or deny this action on these resources. A Condition adds an extra requirement.</desc><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#203b36}.title{font-size:26px;font-weight:700}.body{font-size:21px;fill:#405c54}.connector{font-size:15px;font-weight:700;fill:#61776c}</style><rect width="100%" height="100%" rx="22" fill="#f5f7ef"/><g><rect x="16" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="170" cy="97" r="46" fill="#e7efdf"/><g transform="translate(138 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="36" r="29"/><path d="M20 36l11 11 23-25"/></g><text x="170" y="181" class="title">Effect</text><text x="170" y="227" class="body">Allow or Deny</text><text x="170" y="263" class="body">What is the decision?</text></g><g><rect x="386" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="540" cy="97" r="46" fill="#e7efdf"/><g transform="translate(508 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h26l16 16v48H16zM42 4v16h16M26 34h22M26 46h22M26 58h14"/></g><text x="540" y="181" class="title">Action</text><text x="540" y="227" class="body">GetObject = read</text><text x="540" y="263" class="body">What can they do?</text></g><g><rect x="756" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="910" cy="97" r="46" fill="#e7efdf"/><g transform="translate(878 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="36" cy="14" rx="26" ry="9"/><path d="M10 14l6 43c2 14 38 14 40 0l6-43M16 48c8 8 32 8 40 0"/></g><text x="910" y="181" class="title">Resource</text><text x="910" y="227" class="body">A bucket or its files</text><text x="910" y="263" class="body">Where can they do it?</text></g><text x="355" y="183" class="connector">WHAT</text><text x="725" y="183" class="connector">WHERE</text></svg>
