<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-labelledby="title description"><title id="title">A Reader gets only the read grant</title><desc id="description">Alice’s Reader job allows development reads. It does not grant development uploads or access to reports.</desc><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#203b36}.title{font-size:26px;font-weight:700}.body{font-size:21px;fill:#405c54}.connector{font-size:15px;font-weight:700;fill:#61776c}</style><rect width="100%" height="100%" rx="22" fill="#f5f7ef"/><g><rect x="16" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="170" cy="97" r="46" fill="#e7efdf"/><g transform="translate(138 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="20" r="12"/><path d="M14 64v-8a22 22 0 0 1 44 0v8"/></g><text x="170" y="181" class="title">Alice: Reader</text><text x="170" y="227" class="body">Only the Reader group</text><text x="170" y="263" class="body">No other S3 grants</text></g><g><rect x="386" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="540" cy="97" r="46" fill="#e7efdf"/><g transform="translate(508 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h26l16 16v48H16zM42 4v16h16M26 34h22M26 46h22M26 58h14"/></g><text x="540" y="181" class="title">Read development</text><text x="540" y="227" class="body">GetObject is granted</text><text x="540" y="263" class="body">Read allowed</text></g><g><rect x="756" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="910" cy="97" r="46" fill="#ffede5"/><g transform="translate(878 65) scale(.89)" fill="none" stroke="#a44020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="30" width="48" height="37" rx="8"/><path d="M22 30V19a14 14 0 0 1 28 0v11M36 46v8"/></g><text x="910" y="181" class="title">Upload development</text><text x="910" y="227" class="body">PutObject is not granted</text><text x="910" y="263" class="body">Implicitly denied</text></g><text x="355" y="183" class="connector">CAN</text><text x="725" y="183" class="connector">NOT</text></svg>
