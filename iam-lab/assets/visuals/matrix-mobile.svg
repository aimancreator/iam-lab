<svg xmlns="http://www.w3.org/2000/svg" width="440" height="860" viewBox="0 0 440 860" role="img" aria-labelledby="title description"><title id="title">Bucket names do not assign ownership</title><desc id="description">An account owns its buckets. User A can access Bucket B if the applicable policies allow that request.</desc><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#203b36}.title{font-size:29px;font-weight:700}.body{font-size:25px;fill:#405c54}.connector{font-size:15px;font-weight:700;fill:#61776c}</style><rect width="100%" height="100%" rx="22" fill="#f5f7ef"/><g><rect x="20" y="16" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="80" r="46" fill="#e7efdf"/><g transform="translate(188 48) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="20" r="12"/><path d="M14 64v-8a22 22 0 0 1 44 0v8"/></g><text x="220" y="153" class="title">User A</text><text x="220" y="195" class="body">Requests a file in B</text><text x="220" y="230" class="body">The name does not decide</text></g><g><rect x="20" y="308" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="372" r="46" fill="#e7efdf"/><g transform="translate(188 340) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="8" width="46" height="58" rx="7"/><path d="M27 8V4h20v4M23 27l4 4 6-8M39 27h12M23 43l4 4 6-8M39 43h12M25 57h26"/></g><text x="220" y="445" class="title">Check A’s policies</text><text x="220" y="487" class="body">Action + Bucket B ARN</text><text x="220" y="522" class="body">Also check restrictions</text></g><g><rect x="20" y="600" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="664" r="46" fill="#e7efdf"/><g transform="translate(188 632) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="36" cy="14" rx="26" ry="9"/><path d="M10 14l6 43c2 14 38 14 40 0l6-43M16 48c8 8 32 8 40 0"/></g><text x="220" y="737" class="title">Bucket B</text><text x="220" y="779" class="body">Allow can grant access</text><text x="220" y="814" class="body">Otherwise: denied</text></g><text x="220" y="293" class="connector" transform="rotate(90 220 285)">→</text><text x="220" y="585" class="connector" transform="rotate(90 220 577)">→</text></svg>
