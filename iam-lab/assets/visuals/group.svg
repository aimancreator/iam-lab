<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-labelledby="title description"><title id="title">A group shares its attached permissions</title><desc id="description">Put users in a group and attach a policy to that group. Membership alone is not enough.</desc><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#203b36}.title{font-size:26px;font-weight:700}.body{font-size:21px;fill:#405c54}.connector{font-size:15px;font-weight:700;fill:#61776c}</style><rect width="100%" height="100%" rx="22" fill="#f5f7ef"/><g><rect x="16" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="170" cy="97" r="46" fill="#e7efdf"/><g transform="translate(138 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="18" r="10"/><circle cx="12" cy="28" r="8"/><circle cx="60" cy="28" r="8"/><path d="M20 64V50a16 16 0 0 1 32 0v14M2 64V50a10 10 0 0 1 12-10M70 64V50a10 10 0 0 0-12-10"/></g><text x="170" y="181" class="title">Group members</text><text x="170" y="227" class="body">Alice and Bob</text><text x="170" y="263" class="body">Each keeps their identity</text></g><g><rect x="386" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="540" cy="97" r="46" fill="#e7efdf"/><g transform="translate(508 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="62" height="62" rx="12"/><circle cx="26" cy="27" r="8"/><circle cx="48" cy="27" r="8"/><path d="M13 56v-5a13 13 0 0 1 26 0v5M40 39a13 13 0 0 1 19 12v5"/></g><text x="540" y="181" class="title">One group</text><text x="540" y="227" class="body">For example: Readers</text><text x="540" y="263" class="body">Contains users, not roles</text></g><g><rect x="756" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="910" cy="97" r="46" fill="#e7efdf"/><g transform="translate(878 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="8" width="46" height="58" rx="7"/><path d="M27 8V4h20v4M23 27l4 4 6-8M39 27h12M23 43l4 4 6-8M39 43h12M25 57h26"/></g><text x="910" y="181" class="title">Shared policy</text><text x="910" y="227" class="body">One set of rules</text><text x="910" y="263" class="body">Applies to its members</text></g><text x="355" y="183" class="connector">→</text><text x="725" y="183" class="connector">→</text></svg>
