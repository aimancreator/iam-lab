<svg xmlns="http://www.w3.org/2000/svg" width="440" height="860" viewBox="0 0 440 860" role="img" aria-labelledby="title description"><title id="title">Remove access, but remember the identity</title><desc id="description">Removing these groups removes their S3 grants. It does not automatically delete the user or end every session.</desc><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#203b36}.title{font-size:29px;font-weight:700}.body{font-size:25px;fill:#405c54}.connector{font-size:15px;font-weight:700;fill:#61776c}</style><rect width="100%" height="100%" rx="22" fill="#f5f7ef"/><g><rect x="20" y="16" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="80" r="46" fill="#e7efdf"/><g transform="translate(188 48) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="62" height="62" rx="12"/><circle cx="26" cy="27" r="8"/><circle cx="48" cy="27" r="8"/><path d="M13 56v-5a13 13 0 0 1 26 0v5M40 39a13 13 0 0 1 19 12v5"/></g><text x="220" y="153" class="title">Remove groups</text><text x="220" y="195" class="body">All three lab jobs</text><text x="220" y="230" class="body">No group grants remain</text></g><g><rect x="20" y="308" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="372" r="46" fill="#ffede5"/><g transform="translate(188 340) scale(.89)" fill="none" stroke="#a44020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="30" width="48" height="37" rx="8"/><path d="M22 30V19a14 14 0 0 1 28 0v11M36 46v8"/></g><text x="220" y="445" class="title">Lab S3 access</text><text x="220" y="487" class="body">No other grants here</text><text x="220" y="522" class="body">Reads implicitly denied</text></g><g><rect x="20" y="600" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="664" r="46" fill="#e7efdf"/><g transform="translate(188 632) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="20" r="12"/><path d="M14 64v-8a22 22 0 0 1 44 0v8"/></g><text x="220" y="737" class="title">User still exists</text><text x="220" y="779" class="body">Sign-in is separate</text><text x="220" y="814" class="body">Full offboarding needs more</text></g><text x="220" y="293" class="connector" transform="rotate(90 220 285)">→</text><text x="220" y="585" class="connector" transform="rotate(90 220 577)">→</text></svg>
