<svg xmlns="http://www.w3.org/2000/svg" width="440" height="860" viewBox="0 0 440 860" role="img" aria-labelledby="title description"><title id="title">Allow plus explicit Deny still means no</title><desc id="description">Removing a Deny is not the same as adding an Allow. A grant must still remain.</desc><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#203b36}.title{font-size:29px;font-weight:700}.body{font-size:25px;fill:#405c54}.connector{font-size:15px;font-weight:700;fill:#61776c}</style><rect width="100%" height="100%" rx="22" fill="#f5f7ef"/><g><rect x="20" y="16" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="80" r="46" fill="#e7efdf"/><g transform="translate(188 48) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="36" r="29"/><path d="M20 36l11 11 23-25"/></g><text x="220" y="153" class="title">Allow matches</text><text x="220" y="195" class="body">A policy grants access</text><text x="220" y="230" class="body">Not the final answer</text></g><g><rect x="20" y="308" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="372" r="46" fill="#ffede5"/><g transform="translate(188 340) scale(.89)" fill="none" stroke="#a44020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5h24l19 19v24L48 67H24L5 48V24zM20 36h32"/></g><text x="220" y="445" class="title">Deny also matches</text><text x="220" y="487" class="body">A policy forbids it</text><text x="220" y="522" class="body">Deny takes precedence</text></g><g><rect x="20" y="600" width="400" height="248" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="220" cy="664" r="46" fill="#ffede5"/><g transform="translate(188 632) scale(.89)" fill="none" stroke="#a44020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="30" width="48" height="37" rx="8"/><path d="M22 30V19a14 14 0 0 1 28 0v11M36 46v8"/></g><text x="220" y="737" class="title">Request denied</text><text x="220" y="779" class="body">Explicit deny</text><text x="220" y="814" class="body">More Allows do not fix it</text></g><text x="220" y="293" class="connector">BUT</text><text x="220" y="585" class="connector">SO</text></svg>
