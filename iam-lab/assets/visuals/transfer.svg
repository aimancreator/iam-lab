<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-labelledby="title description"><title id="title">Changing jobs includes removing old access</title><desc id="description">Remove Alice’s old memberships before adding only the new job. Otherwise the old grants can remain.</desc><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#203b36}.title{font-size:26px;font-weight:700}.body{font-size:21px;fill:#405c54}.connector{font-size:15px;font-weight:700;fill:#61776c}</style><rect width="100%" height="100%" rx="22" fill="#f5f7ef"/><g><rect x="16" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="170" cy="97" r="46" fill="#e7efdf"/><g transform="translate(138 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="62" height="62" rx="12"/><circle cx="26" cy="27" r="8"/><circle cx="48" cy="27" r="8"/><path d="M13 56v-5a13 13 0 0 1 26 0v5M40 39a13 13 0 0 1 19 12v5"/></g><text x="170" y="181" class="title">Remove old jobs</text><text x="170" y="227" class="body">Reader + Developer</text><text x="170" y="263" class="body">Old grants go away</text></g><g><rect x="386" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="540" cy="97" r="46" fill="#e7efdf"/><g transform="translate(508 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="20" r="12"/><path d="M14 64v-8a22 22 0 0 1 44 0v8"/></g><text x="540" y="181" class="title">Assign Auditor</text><text x="540" y="227" class="body">Alice’s new job</text><text x="540" y="263" class="body">Only this group remains</text></g><g><rect x="756" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="910" cy="97" r="46" fill="#e7efdf"/><g transform="translate(878 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h26l16 16v48H16zM42 4v16h16M26 34h22M26 46h22M26 58h14"/></g><text x="910" y="181" class="title">Reports access</text><text x="910" y="227" class="body">Read reports: allowed</text><text x="910" y="263" class="body">Development: not granted</text></g><text x="355" y="183" class="connector">→</text><text x="725" y="183" class="connector">→</text></svg>
