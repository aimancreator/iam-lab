<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" role="img" aria-labelledby="title description"><title id="title">An application can use a role too</title><desc id="description">EC2 gets temporary role credentials through an instance profile. The role’s S3 policy decides what the app may access.</desc><style>text{font-family:Arial,Helvetica,sans-serif;text-anchor:middle;fill:#203b36}.title{font-size:26px;font-weight:700}.body{font-size:21px;fill:#405c54}.connector{font-size:15px;font-weight:700;fill:#61776c}</style><rect width="100%" height="100%" rx="22" fill="#f5f7ef"/><g><rect x="16" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="170" cy="97" r="46" fill="#e7efdf"/><g transform="translate(138 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="5" width="52" height="26" rx="6"/><rect x="10" y="41" width="52" height="26" rx="6"/><path d="M22 18h4M35 18h15M22 54h4M35 54h15M36 31v10"/></g><text x="170" y="181" class="title">EC2 application</text><text x="170" y="227" class="body">No embedded user keys</text><text x="170" y="263" class="body">AWS supplies credentials</text></g><g><rect x="386" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="540" cy="97" r="46" fill="#e7efdf"/><g transform="translate(508 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16h62v14a7 7 0 0 0 0 14v14H5V44a7 7 0 0 0 0-14zM48 23v5M48 34v5M48 45v5M16 31h21M16 43h14"/></g><text x="540" y="181" class="title">Role + profile</text><text x="540" y="227" class="body">Trust permits EC2</text><text x="540" y="263" class="body">Policy grants scoped access</text></g><g><rect x="756" y="20" width="308" height="304" rx="20" fill="#ffffff" stroke="#d7e1d4" stroke-width="2"/><circle cx="910" cy="97" r="46" fill="#e7efdf"/><g transform="translate(878 65) scale(.89)" fill="none" stroke="#25564d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="36" cy="14" rx="26" ry="9"/><path d="M10 14l6 43c2 14 38 14 40 0l6-43M16 48c8 8 32 8 40 0"/></g><text x="910" y="181" class="title">S3 request</text><text x="910" y="227" class="body">Only permitted actions</text><text x="910" y="263" class="body">Not every bucket or file</text></g><text x="355" y="183" class="connector">→</text><text x="725" y="183" class="connector">→</text></svg>
